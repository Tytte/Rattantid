name: Rattantid-test
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4      
    - name: Kontrollera arbetsflödet
      run: echo "Rattantid fungerar"
    - name: Testa Python
      run: python trafikdata.py
      env:
          TRAFIKVERKET_API_KEY: ${{ secrets.TRAFIKVERKET_API_KEY}}
    - name: Spara trafikdata
      uses: actions/upload-artifact@v4
      with:
        name: trafikdata                 
        path: trafikdata.json            
